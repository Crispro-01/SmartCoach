<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Smart Coach - Agentes</title>

    <link rel="stylesheet" href="estilos.css">
    <script src="menu.js" defer></script>
    <script src="agentes.js" defer></script>
</head>

<body>

    <main class="dashboard">

        <aside class="menu-lateral">

            <div class="cabecera-menu">
                <h1>Smart Coach</h1>
                <button type="button" class="boton-menu" aria-label="Contraer menú" aria-expanded="true">☰</button>
            </div>

            <nav class="navegacion-menu">

                <a href="dashboard.html">Inicio</a>
                <a href="agentes.html" class="activo">Agentes</a>
                <a href="historial.html">Historial</a>
                <a href="index.html">Cerrar sesión</a>

            </nav>

        </aside>

        <section class="contenido-dashboard">

            <header class="cabecera-dashboard">

                <div>
                    <h2>Agentes</h2>
                    <p>Consulta los agentes asignados actualmente a tu equipo.</p>
                </div>

                <div class="usuario-dashboard">
                    <span>Coach</span>
                </div>

            </header>

            <section class="lista-agentes">

                <div class="cabecera-lista-agentes">
                    <h3>Mis agentes</h3>
                    <p>Agentes asignados actualmente a tu equipo.</p>
                </div>

                <table class="tabla-agentes">

                    <thead>
                        <tr>
                            <th>Agente</th>
                            <th>ID empleado</th>
                            <th>Última sesión</th>
                            <th>Tipo de sesión</th>
                            <th>Acción</th>
                        </tr>
                    </thead>

                    <tbody id="listaAgentes">
                        <tr><td colspan="5">Cargando agentes…</td></tr>
                    </tbody>

                </table>

            </section>

        </section>

    </main>

</body>

</html>

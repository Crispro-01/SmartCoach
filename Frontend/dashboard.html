<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Smart Coach - Dashboard</title>

    <link rel="stylesheet" href="estilos.css">
    <script src="dialogos.js" defer></script>
    <script src="menu.js" defer></script>
    <script src="dashboard.js" defer></script>
</head>

<body>

    <main class="dashboard pagina-inicio">

        <aside class="menu-lateral">

            <div class="cabecera-menu">
                <h1>Smart Coach</h1>
                <button type="button" class="boton-menu" aria-label="Contraer menú" aria-expanded="true">☰</button>
            </div>

            <nav class="navegacion-menu">

                <a href="dashboard.html" class="activo">Inicio</a>

                <a href="agentes.html">Agentes</a>

                <a href="historial.html">Historial</a>

                <a href="seguimiento.html">Seguimiento</a>

                <a href="index.html">Cerrar sesión</a>

            </nav>

        </aside>

        <section class="contenido-dashboard">

            <header class="cabecera-dashboard">

                <div>
                    <h2 id="nombreCoach">Coach</h2>
                    <p>Resumen de tus agentes y sesiones de Coaching.</p>
                </div>

                <div class="usuario-dashboard">
                    <span>Coach</span>
                </div>
            </header>

            <p id="mensajeResumen" role="status" aria-live="polite">Cargando resumen…</p>
            <button id="reintentarResumen" type="button" class="boton-principal" hidden>Reintentar</button>
            <section class="resumen-dashboard" aria-label="Resumen del Coach">

                <div class="tarjeta-resumen">
                    <h3>Agentes</h3>
                    <p id="totalAgentes">—</p>
                </div>

                <div class="tarjeta-resumen">
                    <h3>Sesiones</h3>
                    <p id="totalSesiones">—</p>
                </div>

                <div class="tarjeta-resumen">
                    <h3>Incompletas</h3>
                    <p id="totalIncompletas">—</p>
                </div>

            </section>

            <section class="acciones-dashboard">
                <h3>Acciones rápidas</h3>

                <div class="acciones-contenedor">

                    <a href="agentes.html" class="accion-rapida">
                        Gestionar agentes
                    </a>

                    <a href="historial.html" class="accion-rapida">
                        Ver historial
                    </a>

                </div>

            </section>

        </section>

    </main>

</body>

</html>

<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Smart Coach - Iniciar sesión</title>

    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <main class="contenedor-login">

        <section class="panel-marca">

            <div class="logo-smart">
                🎧
            </div>

            <h1>Smart Coach</h1>

            <img
    src="imagenes/equipo smart coach.webp"
    alt="Equipo de trabajo utilizando Smart Coach"
    class="imagen-equipo"
>

            <p>Optimiza el rendimiento de tu equipo</p>


        </section>

        <section class="panel-formulario">

            <div class="tarjeta-login">

                <h2>Bienvenido</h2>
                <h3>Iniciar sesión</h3>

                <form id="formularioLogin">

                    <div class="campo">

                        <label for="correo">
                            Correo electrónico
                        </label>

                        <input
                            type="email"
                            id="correo"
                            placeholder="usuario@empresa.com"
                            required
                        >

                    </div>

                    <div class="campo">

                        <label for="contrasena">
                            Contraseña
                        </label>

                        <input
                            type="password"
                            id="contrasena"
                            placeholder="Ingresa tu contraseña"
                            required
                        >

                    </div>

                    <button class="boton-login" type="submit">
                        Iniciar sesión
                    </button>

                    <p id="mensajeLogin"></p>

                </form>

                <p class="texto-registro">
                    ¿No tienes una cuenta?
                    <a href="registro.html">Regístrate aquí</a>
                </p>

            </div>

        </section>

    </main>

    <script src="login.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Coach - Sesión correctiva</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="menu.js" defer></script>
    <script src="formulario-correctivo.js" defer></script>
</head>
<body>
    <main class="dashboard">
        <aside class="menu-lateral">
            <div class="cabecera-menu">
                <h1>Smart Coach</h1>
                <button type="button" class="boton-menu" aria-label="Contraer menú" aria-expanded="true">☰</button>
            </div>
            <nav class="navegacion-menu" aria-label="Navegación principal">
                <a href="dashboard.html">Inicio</a>
                <a href="agentes.html" class="activo" aria-current="page">Agentes</a>
                <a href="historial.html">Historial</a>
                <a href="index.html">Cerrar sesión</a>
            </nav>
        </aside>

        <section class="contenido-dashboard">
            <header class="cabecera-dashboard">
                <div>
                    <a id="volverAgente" href="agentes.html" class="enlace-volver">← Volver al agente</a>
                    <h2 id="tituloSesionCorrectiva">Sesión correctiva</h2>
                    <p>Documenta la situación y los compromisos acordados.</p>
                </div>
                <div class="usuario-dashboard"><span>Coach</span></div>
            </header>

            <section class="tarjeta-sesion tarjeta-correctiva" aria-labelledby="tituloFormularioCorrectivo">
                <div class="cabecera-formulario">
                    <div>
                        <h3 id="tituloFormularioCorrectivo">Información de la sesión</h3>
                        <p>Los campos marcados con * son obligatorios.</p>
                    </div>
                    <div class="fecha-inicio-sesion">
                        <label for="fechaHoraInicioCorrectiva">Fecha y hora de inicio</label>
                        <input type="datetime-local" id="fechaHoraInicioCorrectiva" name="fechaHoraInicio" form="formularioCorrectivo" readonly required>
                    </div>
                </div>

                <form id="formularioCorrectivo" action="#" method="post">
                    <div class="fila-formulario">
                        <div class="campo">
                            <label for="agenteCorrectivo">Agente</label>
                            <input type="text" id="agenteCorrectivo" readonly>
                            <input type="hidden" id="agenteIdCorrectivo" name="agenteId">
                        </div>
                        <div class="campo">
                            <label for="tipoSesionCorrectiva">Tipo de sesión</label>
                            <input type="text" id="tipoSesionCorrectiva" name="tipoSesion" readonly>
                        </div>
                    </div>

                    <div class="campo campo-pregunta">
                        <label for="causaSituacion">
                            1. ¿Qué situación o dificultad llevó al representante a cometer la falta? *
                        </label>
                        <textarea id="causaSituacion" name="causaSituacion" rows="5" maxlength="1500" placeholder="Describe la causa desde la perspectiva del representante" required></textarea>
                    </div>

                    <div class="campo campo-pregunta">
                        <label for="compromisoRepresentante">
                            2. ¿Qué hará el representante para evitar que esta situación vuelva a suceder? *
                        </label>
                        <textarea id="compromisoRepresentante" name="compromisoRepresentante" rows="5" maxlength="1500" placeholder="Registra el compromiso concreto del representante" required></textarea>
                    </div>

                    <div class="campo campo-pregunta">
                        <label for="compromisoCoach">
                            3. ¿Qué hará el Coach para apoyar al representante y evitar que vuelva a suceder? *
                        </label>
                        <textarea id="compromisoCoach" name="compromisoCoach" rows="5" maxlength="1500" placeholder="Registra el acompañamiento y seguimiento del Coach" required></textarea>
                    </div>

                    <div class="acciones-formulario">
                        <a id="cancelarFormularioCorrectivo" href="agentes.html" class="boton-secundario">Cancelar</a>
                        <button type="submit" id="guardarSesionCorrectiva" class="boton-principal">Guardar sesión</button>
                    </div>
                </form>
            </section>
        </section>
    </main>
</body>
</html>

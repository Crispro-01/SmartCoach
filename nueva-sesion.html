<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Coach - Nueva sesión</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="menu.js" defer></script>
    <script src="nueva-sesion.js" defer></script>
</head>
<body>
    <main class="dashboard">
        <aside class="menu-lateral">
            <div class="cabecera-menu">
                <h1>Smart Coach</h1>
                <button type="button" class="boton-menu" aria-label="Contraer menú" aria-expanded="true">☰</button>
            </div>
            <nav class="navegacion-menu" aria-label="Navegación principal">
                <a href="dashboard.html">Inicio</a>
                <a href="agentes.html" class="activo" aria-current="page">Agentes</a>
                <a href="historial.html">Historial</a>
                <a href="index.html">Cerrar sesión</a>
            </nav>
        </aside>

        <section class="contenido-dashboard">
            <header class="cabecera-dashboard">
                <div>
                    <h2>Nueva sesión</h2>
                    <p>Selecciona el tipo de sesión para el agente consultado.</p>
                </div>
                <div class="usuario-dashboard">
                    <span>Coach</span>
                </div>
            </header>

            <section class="tarjeta-sesion" aria-labelledby="tituloFormularioSesion">
                <div class="cabecera-formulario">
                    <div>
                        <h3 id="tituloFormularioSesion">Preparar nueva sesión</h3>
                        <p>Los campos marcados con * son obligatorios.</p>
                    </div>
                    <div class="fecha-inicio-sesion">
                        <label for="fechaHoraInicio">Fecha y hora de inicio</label>
                        <input type="datetime-local" id="fechaHoraInicio" name="fechaHoraInicio" form="formularioSesion" readonly required>
                    </div>
                </div>

                <form id="formularioSesion" action="#" method="post">
                    <div class="fila-formulario">
                        <div class="campo">
                            <label for="agenteSesion">Agente</label>
                            <input type="text" id="agenteSesion" readonly>
                            <input type="hidden" id="agenteId" name="agenteId">
                        </div>

                        <div class="campo">
                            <label for="tipoSesion">Tipo de sesión *</label>
                            <select id="tipoSesion" name="tipoSesion" required>
                                <option value="" selected disabled>Selecciona el tipo</option>
                                <option value="ITGF">ITGF</option>
                                <option value="Coaching">Coaching</option>
                                <option value="Accountability">Accountability</option>
                                <option value="Verbal Warning">Verbal Warning</option>
                                <option value="Final Warning">Final Warning</option>
                                <option value="Suspensión">Suspensión</option>
                                <option value="Huddle">Huddle</option>
                            </select>
                        </div>
                    </div>

                    <div class="acciones-formulario">
                        <a id="cancelarNuevaSesion" href="agentes.html" class="boton-secundario">Cancelar</a>
                        <button type="submit" id="continuarSesion" class="boton-principal">Continuar</button>
                    </div>
                </form>
            </section>
        </section>
    </main>
</body>
</html>
